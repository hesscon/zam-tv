services:
  zam-tv:
    build:
      context: .
    container_name: zam-tv
    ports:
      - "80:8000"
    environment:
      CALENDAR_CACHE_REFRESH_SECONDS: "900"
    volumes:
      - ./config:/app/config
      - ./data/models:/app/data/models:ro
      - ./data/uploads:/app/data/uploads
    restart: unless-stopped
